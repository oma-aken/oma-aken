<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oma_Aken | Mixing Commission Form</title>
  <style>
    :root {
      --green: #1f4a38;
      --green-dark: #173a2b;
      --wood: #8a6747;
      --wood-light: #d9c9b3;
      --cream: #f7f3eb;
      --paper: #fffdf8;
      --text: #45413c;
      --muted: #7c746a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: transparent;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: var(--text);
    }

    .wrap {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 22px 16px 28px;
    }

    .card {
      background: var(--cream);
      border: 1px solid rgba(138,103,71,.22);
      border-radius: 22px;
      padding: 34px 24px;
      box-shadow: 0 10px 28px rgba(40,35,27,.08);
      text-align: center;
    }

    .eyebrow {
      color: var(--wood);
      font-size: 11px;
      letter-spacing: .18em;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      color: var(--green);
      font-size: clamp(22px, 5vw, 30px);
      letter-spacing: .04em;
    }

    .sub {
      margin: 12px 0 26px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .copy-btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 18px 20px;
      background: var(--green);
      color: var(--cream);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    .copy-btn:hover { background: var(--green-dark); }
    .copy-btn:active { transform: scale(.99); }

    .status {
      min-height: 22px;
      margin-top: 13px;
      color: var(--wood);
      font-size: 12px;
      font-weight: 700;
    }

    .guide {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: var(--paper);
      border: 1px solid var(--wood-light);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      text-align: left;
    }

    .guide b { color: var(--green); }

    .small {
      margin-top: 22px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    textarea {
      position: fixed;
      left: -9999px;
      top: 0;
      opacity: 0;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="eyebrow">OMA_AKEN</div>
      <h1>COMMISSION FORM</h1>

      <p class="sub">
        아래 버튼을 눌러 의뢰 양식을 복사한 후<br>
        아트머그 문의창에 붙여넣어 작성해주세요.
      </p>

      <button class="copy-btn" id="copyButton" type="button">
        📋 COMMISSION FORM 복사하기
      </button>

      <div class="status" id="status" aria-live="polite"></div>

      <div class="guide">
        <b>HOW TO COMMISSION</b><br>
        01. 「COMMISSION FORM 복사하기」 버튼을 누릅니다.<br>
        02. 아트머그 문의창으로 돌아갑니다.<br>
        03. 붙여넣은 뒤 [ ] 안의 내용을 작성해서 보내주세요.
      </div>

      <div class="small">
        OMA_AKEN · MIXING &amp; MASTERING COMMISSION
      </div>
    </section>
  </main>

  <textarea id="fallbackCopy" readonly></textarea>

  <script>
    const commissionForm = `🌲 Oma_Aken MIXING COMMISSION

────────────────────

01. 의뢰자명 / 닉네임
[ ]

02. 연락 가능한 수단
[ Discord / X / Email 등 ]

────────────────────

03. 곡 제목
[ ]

04. 원곡 또는 참고 링크
[ ]

05. 장르
[ ]

06. 곡 길이
[ 예 : 03:42 ]

07. 보컬 트랙 수
[ ]

────────────────────

08. 원하는 작업
[ ] 믹싱 + 마스터링
[ ] 피치 보정 포함
[ ] 타이밍 보정 포함
[ ] 상담 후 결정

────────────────────

09. 원하는 믹싱 방향
[ 원하는 분위기, 강조하고 싶은 부분 등을 작성해주세요. ]

10. 참고 음원
[ YouTube / Spotify / SoundCloud 등의 링크 ]

────────────────────

11. MR / Inst 파일 링크
[ Google Drive / Dropbox 등 ]

12. Vocal 파일 링크
[ Google Drive / Dropbox 등 ]

────────────────────

13. 희망 마감일
[ ]

14. 희망 마감일 관련 사항
[ ]

────────────────────

15. 추가 요청사항
[ ]

────────────────────

※ 안내 사항을 확인했습니다.
[ 작업 기간 및 수정 사항에 대한 안내를 확인했습니다. ]

────────────────────

Thank you for your commission.

Oma_Aken
MIXING & MASTERING COMMISSION`;

    const button = document.getElementById('copyButton');
    const status = document.getElementById('status');
    const fallback = document.getElementById('fallbackCopy');

    async function copyForm() {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(commissionForm);
        } else {
          fallback.value = commissionForm;
          fallback.focus();
          fallback.select();
          const success = document.execCommand('copy');
          if (!success) throw new Error('Fallback copy failed');
        }

        button.textContent = '✓ 복사되었습니다!';
        status.textContent = '이제 아트머그 문의창에 붙여넣어주세요.';
        setTimeout(() => {
          button.textContent = '📋 COMMISSION FORM 복사하기';
          status.textContent = '';
        }, 2500);
      } catch (error) {
        status.textContent = '자동 복사가 되지 않았습니다. 다시 한 번 눌러주세요.';
      }
    }

    button.addEventListener('click', copyForm);
  </script>
</body>
</html>
